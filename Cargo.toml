[package]
name = "tmdbtag"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-sdk-s3 = "1.144"
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
dialoguer = { version = "0.12", default-features = false, features = ["password"] }
indicatif = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["net", "rt-multi-thread", "sync", "time"] }
urlencoding = "2.1"

[dev-dependencies]
tempfile = "3.27"
